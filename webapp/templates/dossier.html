<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Console | Discovery Dossiers</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0c; 
            --bg-panel: #111114;
            --accent: #00d4ff; 
            --accent-dim: rgba(0, 212, 255, 0.1);
            --border-ui: #26262a;
            --font-mono: 'Roboto Mono', monospace;
            --text-main: #d1d5db;
            --text-dim: #6b7280;
            --danger: #ef4444;
            --success: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            overflow: hidden; 
        }

        header {
            height: 60px;
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            align-items: center;
            padding: 0 30px;
            justify-content: space-between;
            background: var(--bg-panel);
            z-index: 10;
        }

        .brand { font-family: var(--font-mono); font-size: 14px; color: var(--accent); letter-spacing: 2px; }
        .top-nav {
            display: flex;
            gap: 14px;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 10px;
        }
        .top-nav a {
            color: var(--text-dim);
            text-decoration: none;
            border: 1px solid var(--border-ui);
            padding: 5px 8px;
        }
        .top-nav a:hover,
        .top-nav a.active {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Actions Bar */
        .actions-bar {
            padding: 15px 30px;
            background: rgba(255,255,255,0.01);
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            justify-content: flex-end;
        }

        main { flex-grow: 1; overflow-y: auto; padding: 30px; position: relative; }
        
        .dossier-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .dossier-table th {
            text-align: left;
            padding: 15px;
            color: var(--text-dim);
            border-bottom: 2px solid var(--border-ui);
            text-transform: uppercase;
            font-size: 10px;
        }

        .dossier-table tr {
            border-bottom: 1px solid var(--border-ui);
            transition: background 0.2s;
        }

        .dossier-table tbody tr {
            cursor: pointer;
        }

        .dossier-table tbody tr:hover {
            background: rgba(0, 212, 255, 0.08);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }
        .dossier-table td { padding: 12px 15px; vertical-align: middle; }

        /* Responsive design */
        @media (max-width: 768px) {
            .dossier-table th,
            .dossier-table td {
                padding: 8px 6px;
                font-size: 11px;
            }

            .dossier-table th:nth-child(3),
            .dossier-table td:nth-child(3) {
                display: none; /* Hide coordinates on mobile */
            }

            .preview-container {
                width: 40px;
                height: 40px;
            }

            .thumb-img {
                width: 100%;
                height: 100%;
            }
        }

        /* Preview Image Logic */
        .preview-container {
            position: relative;
            width: 50px;
            height: 50px;
            cursor: zoom-in;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid var(--border-ui);
            filter: grayscale(0.5) contrast(1.2);
            transition: 0.3s;
        }

        .preview-container:hover .thumb-img {
            filter: grayscale(0) contrast(1);
            border-color: var(--accent);
            transform: scale(1.1);
        }

        /* Hover Zoom Pop-out */
        .preview-container .full-preview {
            position: absolute;
            left: 60px;
            top: -50px;
            width: 200px;
            height: 200px;
            border: 2px solid var(--accent);
            background: #000;
            z-index: 100;
            display: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .preview-container:hover .full-preview {
            display: block;
        }

        .btn-purge {
            background: transparent;
            border: 1px solid var(--border-ui);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 9px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .btn-purge:hover { border-color: var(--danger); color: var(--danger); }
        .confirm-delete { background: var(--danger) !important; color: white !important; }

        .badge {
            padding: 2px 6px;
            font-size: 9px;
            border: 1px solid var(--border-ui);
            text-transform: uppercase;
        }
        .badge.galaxy { color: var(--accent); border-color: var(--accent); }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-ui);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state h3 {
            font-family: var(--font-mono);
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .fade-out { opacity: 0; transform: translateX(30px); transition: 0.4s; }


        /* Custom Scrollbar Styling */
    /* Works on Chrome, Edge, Safari, and Opera */
    main::-webkit-scrollbar {
        width: 8px; /* Slimmer for a technical look */
    }

    main::-webkit-scrollbar-track {
        background: var(--bg-base); 
        border-left: 1px solid var(--border-ui);
    }

    main::-webkit-scrollbar-thumb {
        background: var(--border-ui);
        border-radius: 4px;
        transition: background 0.3s;
    }

    main::-webkit-scrollbar-thumb:hover {
        background: var(--accent); /* Glows cyan on hover */
        box-shadow: 0 0 10px var(--accent);
    }

    /* Firefox Support */
    main {
        scrollbar-width: thin;
        scrollbar-color: var(--border-ui) var(--bg-base);
    }
    </style>
</head>
<body>

<header>
    <div class="brand">GCS // DISCOVERY_DOSSIER_ARCHIVE</div>
    <nav class="top-nav">
        <a href="/">MAIN_MENU</a>
        <a href="/survey">OBSERVATION_DECK</a>
        <a href="/assistant">NEURAL_ASSISTANT</a>
        <a href="/dossier" class="active">DOSSIERS</a>
    </nav>
    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);">
        ACTIVE_RECORDS: <span id="record-count" style="color: var(--accent);">0</span>
    </div>
</header>

<div class="actions-bar">
    <button class="btn-purge" onclick="loadObservations()" style="color: var(--accent); border-color: var(--accent);">[ REFRESH_DATA ]</button>
    <div style="flex-grow: 1;"></div>
    <button class="btn-purge" onclick="purgeAll()" style="color: var(--danger);">[ PURGE_ALL_RECORDS ]</button>
</div>

<main>
    <table class="dossier-table">
        <thead>
            <tr>
                <th style="width: 80px;">Preview</th>
                <th>ID_CODE</th>
                <th>COORDINATES</th>
                <th>CLASSIFICATION</th>
                <th>CONF</th>
                <th style="text-align: right;">MANAGEMENT</th>
            </tr>
        </thead>
        <tbody id="dossier-body">
            <!-- Data will be loaded dynamically -->
        </tbody>
    </table>
</main>

<script>
async function loadObservations() {
    const tbody = document.getElementById('dossier-body');
    const countSpan = document.getElementById('record-count');

    // Show loading state
    tbody.innerHTML = `
        <tr>
            <td colspan="6" class="loading">
                <div class="loading-spinner"></div>
                LOADING_DISCOVERY_RECORDS...
            </td>
        </tr>
    `;

    try {
        const response = await fetch('/api/observations');
        const observations = await response.json();

        tbody.innerHTML = '';
        countSpan.textContent = observations.length;

        if (observations.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-state">
                        <h3>NO_DISCOVERY_RECORDS</h3>
                        <p>Begin your astronomical survey to populate the discovery archive.</p>
                        <a href="/survey" style="color: var(--accent); text-decoration: none; font-family: var(--font-mono); font-size: 12px;">
                            → INITIATE_SURVEY_PROTOCOL
                        </a>
                    </td>
                </tr>
            `;
            return;
        }

        observations.forEach(obs => {
            const row = document.createElement('tr');
            row.id = `row-${obs.id}`;

            // Create thumbnail URL (placeholder for now)
            const thumbUrl = obs.has_image ?
                `/api/observation/${obs.id}/image` :
                'https://aladin.u-strasbg.fr/AladinLite/doc/img/aladin-lite.png';

            row.innerHTML = `
                <td>
                    <div class="preview-container">
                        <img class="thumb-img" src="${thumbUrl}" alt="preview" onerror="this.src='https://aladin.u-strasbg.fr/AladinLite/doc/img/aladin-lite.png'">
                        <img class="full-preview" src="${thumbUrl}" alt="zoom" onerror="this.src='https://aladin.u-strasbg.fr/AladinLite/doc/img/aladin-lite.png'">
                    </div>
                </td>
                <td style="color: var(--accent);">${obs.id}</td>
                <td>${obs.coordinates}</td>
                <td><span class="badge galaxy">${obs.classification.replace(' ', '_').toUpperCase()}</span></td>
                <td style="color: var(--success);">${obs.confidence}</td>
                <td style="text-align: right;">
                    <button class="btn-purge" onclick="requestPurge(event, 'row-${obs.id}', this)">[ PURGE ]</button>
                </td>
            `;

            // Add click handler to open report (but not when clicking purge button)
            row.addEventListener('click', (e) => {
                if (!e.target.closest('.btn-purge')) {
                    openReport(obs.id);
                }
            });

            tbody.appendChild(row);
        });
    } catch (error) {
        console.error('Failed to load observations:', error);
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty-state">
                    <h3>SYSTEM_ERROR</h3>
                    <p>Unable to load discovery records. Check neural link status.</p>
                    <button onclick="loadObservations()" style="background: var(--accent); color: #000; border: none; padding: 8px 16px; font-family: var(--font-mono); font-size: 10px; cursor: pointer;">
                        RETRY_CONNECTION
                    </button>
                </td>
            </tr>
        `;
    }
}

async function requestPurge(event, rowId, btn) {
    event.stopPropagation(); // Prevent row click event
    const observationId = rowId.replace('row-', '');
    if (!confirm('PURGE THIS RECORD FROM DATABASE?')) {
        return;
    }

    try {
        const response = await fetch(`/api/observation/${encodeURIComponent(observationId)}/delete`, {
            method: 'DELETE'
        });
        const result = await response.json();

        if (response.ok) {
            const row = document.getElementById(rowId);
            row.classList.add('fade-out');
            setTimeout(() => {
                row.remove();
                updateRecordCount();
            }, 400);
        } else {
            alert(result.error || 'Could not purge record.');
        }
    } catch (error) {
        console.error('Purge failed:', error);
    }
}

function openReport(observationId) {
    window.location.href = `/report?id=${encodeURIComponent(observationId)}`;
}

async function purgeAll() {
    if (!confirm('PURGE ALL RECORDS FROM DATABASE? THIS ACTION CANNOT BE UNDONE.')) {
        return;
    }

    try {
        const response = await fetch('/api/observations/purge', {
            method: 'DELETE'
        });
        if (response.ok) {
            const tbody = document.getElementById('dossier-body');
            tbody.innerHTML = '';
            updateRecordCount();
            loadObservations();
        } else {
            const result = await response.json();
            alert(result.error || 'Could not purge all records.');
        }
    } catch (error) {
        console.error('Purge all failed:', error);
    }
}

function updateRecordCount() {
    const count = document.querySelectorAll('#dossier-body tr').length;
    document.getElementById('record-count').innerText = count;
}

// Load data when page loads
document.addEventListener('DOMContentLoaded', loadObservations);
</script>

</body>
</html>
