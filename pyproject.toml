[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-classification"
version = "0.1.0"
description = "Galaxy morphology classification using deep learning"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "flask>=2.0.0",
    "flask-cors>=4.0.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
    "requests>=2.25.0",
    "opencv-python>=4.5.0",
    "h5py>=3.6.0",
    "pandas>=1.3.0",
    "streamlit>=1.10.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
galaxy-web = "webapp.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["galaxy_classification*", "webapp*"]

[tool.setuptools.package-data]
galaxy_classification = ["*.sql"]
webapp = ["templates/**", "static/**"]